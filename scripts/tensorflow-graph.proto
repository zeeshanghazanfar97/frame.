// Minimal GraphDef wire schema for the DCT-Net frozen graph.
// Field numbers follow TensorFlow's Apache-2.0 framework protos.
syntax = "proto3";
enum DataType { DT_INVALID=0; DT_FLOAT=1; DT_DOUBLE=2; DT_INT32=3; DT_UINT8=4; DT_INT16=5; DT_INT8=6; DT_STRING=7; DT_COMPLEX64=8; DT_INT64=9; DT_BOOL=10; DT_QINT8=11; DT_QUINT8=12; DT_QINT32=13; DT_BFLOAT16=14; DT_QINT16=15; DT_QUINT16=16; DT_UINT16=17; DT_COMPLEX128=18; DT_HALF=19; DT_RESOURCE=20; DT_VARIANT=21; DT_UINT32=22; DT_UINT64=23; }
message TensorShapeProto { message Dim { int64 size=1; string name=2; } repeated Dim dim=2; bool unknown_rank=3; }
message TensorProto { DataType dtype=1; TensorShapeProto tensor_shape=2; int32 version_number=3; bytes tensor_content=4; repeated float float_val=5; repeated double double_val=6; repeated int32 int_val=7; repeated bytes string_val=8; repeated int64 int64_val=10; repeated bool bool_val=11; }
message AttrValue { message ListValue { repeated bytes s=2; repeated int64 i=3; repeated float f=4; repeated bool b=5; repeated DataType type=6; repeated TensorShapeProto shape=7; repeated TensorProto tensor=8; } ListValue list=1; bytes s=2; int64 i=3; float f=4; bool b=5; DataType type=6; TensorShapeProto shape=7; TensorProto tensor=8; string placeholder=9; }
message NodeDef { string name=1; string op=2; repeated string input=3; string device=4; map<string,AttrValue> attr=5; }
message VersionDef { int32 producer=1; int32 min_consumer=2; repeated int32 bad_consumers=3; }
message GraphDef { repeated NodeDef node=1; VersionDef versions=4; }
