server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Explicit types keep worker modules and WASM compatible across base images.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        font/woff woff;
        font/woff2 woff2;
        text/plain txt;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(self), microphone=(self), fullscreen=(self)' always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Build hashes make these safe to cache across app releases.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Stable model filenames must revalidate when the image is updated.
    # Missing model/worker files must return 404, never the SPA HTML document.
    location ^~ /models/ {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
